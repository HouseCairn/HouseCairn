{% load i18n navigation %}{# On a room, item or stock item page. `kind`, `target`, `label`, `home`, `can_write`. #}
{% if label %}<a class="button button-secondary button-small" href="{% url_with_next 'labels:detail' home_id=home.id label_id=label.id %}">{% translate "QR label" %}</a>{% elif can_write %}<form method="post" action="{% url_with_next 'labels:create' home_id=home.id %}">{% csrf_token %}<input type="hidden" name="target" value="{{ kind }}:{{ target.id }}"><button type="submit" class="button-secondary button-small">{% translate "Make a QR label" %}</button></form>{% endif %}
<a class="button button-secondary button-small" href="{% if kind == "room" %}{% url_with_next 'reports:create' home_id=home.id q_room=target.id %}{% elif kind == "item" %}{% url_with_next 'reports:create' home_id=home.id q_item=target.id %}{% else %}{% url_with_next 'reports:create' home_id=home.id q_article=target.id %}{% endif %}">{% translate "Report a problem" %}</a>
