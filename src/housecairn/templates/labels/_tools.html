{% load i18n %}{# On a room, item or stock item page. `kind`, `target`, `label`, `home`, `can_write`. #}
{% if label %}<a class="button button-secondary button-small" href="{% url 'labels:detail' home_id=home.id label_id=label.id %}">{% translate "QR label" %}</a>{% elif can_write %}<form method="post" action="{% url 'labels:create' home_id=home.id %}">{% csrf_token %}<input type="hidden" name="target" value="{{ kind }}:{{ target.id }}"><button type="submit" class="button-secondary button-small">{% translate "Make a QR label" %}</button></form>{% endif %}
<a class="button button-secondary button-small" href="{% url 'reports:create' home_id=home.id %}?{{ kind }}={{ target.id }}">{% translate "Report a problem" %}</a>
