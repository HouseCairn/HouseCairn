{% load i18n %}{# The banner after a task was marked done or skipped: one tap takes it back. `undo` is the occurrence. #}
{% if undo %}
  <div class="undo-banner" role="status">
    <span>{% if undo.status == "done" %}{% translate "Marked done." %}{% else %}{% translate "Skipped." %}{% endif %}</span>
    <form method="post" action="{% url 'tasks:undo' home_id=home.id task_id=undo.task_id occurrence_id=undo.id %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ undo_return|default:request.path }}">
      <button type="submit" class="button-secondary button-small">{% translate "Undo" %}</button>
    </form>
  </div>
{% endif %}
