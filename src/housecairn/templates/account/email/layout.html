{% load i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head><meta charset="utf-8"><title>{{ subject }}</title></head>
<body style="margin:0;padding:24px;background:#F7F5F1;color:#1F3A3D;font-family:Arial,Helvetica,sans-serif;line-height:1.5">
  <div style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #C8A27C;border-radius:12px;padding:24px">
    <p style="margin:0 0 16px;font-size:20px;font-weight:bold;color:#1F3A3D">{% instance_name %}</p>
    {{ body|urlize|linebreaks }}
  </div>
</body>
</html>
