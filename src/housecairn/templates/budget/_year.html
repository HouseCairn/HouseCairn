{% load i18n l10n %}{# The year to show, and the file of the page. `year`, `years`, `kind`. #}
<form method="get" class="filter-row">
  {% if kind != "projects" %}<label for="budget-year">{% translate "Year" %}</label>
  <select id="budget-year" name="year">
    {% for candidate in years %}<option value="{{ candidate|unlocalize }}"{% if candidate == year %} selected{% endif %}>{{ candidate|unlocalize }}</option>{% endfor %}
  </select>
  <button type="submit" class="button-secondary button-small">{% translate "Show" %}</button>{% endif %}
  <a class="button button-secondary button-small" href="?{% if kind != 'projects' %}year={{ year|unlocalize }}&amp;{% endif %}export=csv">{% translate "Download as CSV" %}</a>
</form>
