{% load i18n %}
{% if page.has_other_pages %}
  <nav class="button-row" aria-label="{% translate 'Pages' %}">
    {% if page.has_previous %}<a class="button button-secondary button-small" href="?page={{ page.previous_page_number }}">{% translate "Newer" %}</a>{% endif %}
    {% if page.has_next %}<a class="button button-secondary button-small" href="?page={{ page.next_page_number }}">{% translate "Older" %}</a>{% endif %}
  </nav>
{% endif %}
