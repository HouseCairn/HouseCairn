{% extends "base.html" %}
{% load i18n %}
{% block head_title %}{{ title }}{% endblock head_title %}
{% block content %}
  <a class="back-link" href="{{ back }}">{% include "components/icon.html" with name="chevron" %}{% translate "Cancel" %}</a>
  <h1>{{ title }}</h1>
  <section class="card">
    <p>{{ text }}</p>
    <form method="post" action="{{ action }}">
      {% csrf_token %}
      <div class="button-row">
        <button type="submit" class="button-danger">{{ button }}</button>
        <a class="button button-secondary" href="{{ back }}">{% translate "Cancel" %}</a>
      </div>
    </form>
  </section>
{% endblock content %}
