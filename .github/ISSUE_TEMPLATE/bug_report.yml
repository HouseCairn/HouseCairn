name: Bug report
description: Something does not work as documented.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a security vulnerability, do not use this
        form: see the security policy and report it privately.
        Remove any personal data (names, addresses, tokens) from what you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Housecairn version
      description: Release tag, or commit if you run from source.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Installation method, database, browser, and enabled integrations.
      placeholder: |
        Container image on amd64, SQLite, Firefox, no integrations
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs as text. They are formatted automatically.
      render: text
