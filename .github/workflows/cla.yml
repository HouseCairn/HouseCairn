# Contributor License Agreement (CLA.md), signed by a pull request comment and
# recorded in this repository on the `cla-signatures` branch (docs/adr/0014).
#
# Exception to the "no pull_request_target" rule, accepted for this file only:
# the action must comment on pull requests from forks and commit signatures,
# which the read-only token of `pull_request` cannot do. This workflow never
# checks out, builds or runs the code of the pull request: it has no checkout
# step and only calls the GitHub API through the action. `issue_comment` is
# needed to receive the signature comment; its body is only compared in `if:`,
# never passed to a shell.
name: CLA

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] -- reads the comment body in `if:` only
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no checkout of PR code, see above
    types: [opened, closed, synchronize]

permissions: {}

concurrency:
  # One run at a time per pull request, so two signatures do not race on the
  # signatures file; runs are queued, never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # re-run the pull request's CLA check after a signature comment
      contents: write # commit signatures to the `cla-signatures` branch
      pull-requests: write # comment on the pull request, lock it after merge
      statuses: write # set the CLA commit status on the pull request
    steps:
      - name: Check signatures # zizmor: ignore[archived-uses]
        # The upstream repository is archived (read-only, no more fixes). Its
        # last release is used, pinned, until a replacement is chosen; see
        # docs/adr/0014. The finding is accepted for this line only.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/HouseCairn/HouseCairn/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: Robvred,dependabot[bot],github-actions[bot]
          create-file-commit-message: "chore(cla): create the CLA signatures file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in $owner/$repo#$pullRequestNo"
