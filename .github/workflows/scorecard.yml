# OpenSSF Scorecard (docs/adr/0014): weekly and on every push to `main`.
# Results are published to the public Scorecard API (badge in README.md) and
# uploaded to code scanning. Scorecard refuses to publish results from a
# workflow with top-level write permissions, `run` steps or other actions.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 04:17 UTC.
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read the repository
      actions: read # read workflow runs (Scorecard's CI checks)
      security-events: write # upload the SARIF results to code scanning
      # id-token: an OIDC token proves to the Scorecard API that the results
      # come from this repository's workflow (publish_results).
      id-token: write # publish the results to the Scorecard API
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
