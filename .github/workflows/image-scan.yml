# Scheduled scan of the published container image (docs/adr/0015, amendment of
# 2026-11-08). A new Debian or Python advisory can make the image published
# from `main` vulnerable without any push to this repository; the scan in
# image.yml only runs on pushes and pull requests. This workflow looks at the
# image as published, every day, with the same Grype release and the same
# rule as the `Container image` check: fail on a fixable high or critical
# vulnerability. It is not a required check, publishes nothing and holds no
# secret; the registry is read anonymously.
name: Image scan

on:
  schedule:
    # Every day at 05:23 UTC.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Published by the `Publish image` job on every push to `main`.
  IMAGE: ghcr.io/housecairn/housecairn:edge
  # Same Grype as image.yml: keep the two in step, by hand (docs/adr/0015).
  GRYPE_VERSION: "0.121.0"
  GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519

jobs:
  scan:
    name: Published image scan
    if: ${{ github.repository == 'HouseCairn/housecairn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No repository access is needed: Grype reads the public image.
    permissions: {}
    steps:
      - name: Install Grype (checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/grype"
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/grype" grype
          "$RUNNER_TEMP/grype/grype" version

      - name: Scan the published image (fails on fixable high or critical)
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          grype="$RUNNER_TEMP/grype/grype"
          # Same scope as the `Container image` check: only vulnerabilities
          # with a fix go to code scanning, the check fails on high or above.
          # linux/amd64 is the platform the check scans on pull requests; the
          # arm64 image is built from the same base and the same Debian sources.
          "$grype" "registry:${IMAGE}" --platform linux/amd64 --only-fixed \
            -o sarif=grype.sarif -o json=grype-fixable.json
          results=$(jq '[.runs[].results[]] | length' grype.sarif)
          fixable=$(jq '.matches | length' grype-fixable.json)
          unfixed=$(jq '[.matches[] | select(.vulnerability.fix.state != "fixed" or (.vulnerability.fix.versions | length) == 0)] | length' grype-fixable.json)
          digest=$(jq -r '.source.target.manifestDigest // "unknown"' grype-fixable.json)
          echo "Scanned ${IMAGE} (${digest}): SARIF ${results} results; fixable matches: ${fixable}; without a fix: ${unfixed}"
          test "$unfixed" = 0
          test "$results" = "$fixable"
          set +e
          "$grype" "registry:${IMAGE}" --platform linux/amd64 --only-fixed --fail-on high -o table | tee grype.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Published image scan (Grype ${GRYPE_VERSION})"
            echo "- Image: \`${IMAGE}\` (\`${digest}\`)"
            echo "- Code scanning receives ${results} fixable results; none without a fix."
            if [ "$status" = 0 ]; then
              echo "- PASS: no fixable vulnerability of high or critical severity"
            else
              echo "- **FAIL: fixable vulnerabilities of high or critical severity in the published image**"
            fi
            echo '```'
            head -n 60 grype.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the scan results for code scanning
        if: ${{ !cancelled() && hashFiles('grype.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-sarif-published
          path: grype.sarif
          retention-days: 7

  code-scanning:
    name: Published image scan (code scanning)
    needs: scan
    if: ${{ !cancelled() && needs.scan.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF results to code scanning
    steps:
      - name: Download the scan results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grype-sarif-published
      # Same category as the scan of `main` in image.yml: the alerts of the
      # image on `main` are refreshed from the published image, not duplicated.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: grype.sarif
          category: container-image
