# Interface checks in a real browser (docs/adr/0017, docs/adr/0018): screenshots of
# the main screens on a phone and a desktop, in English and French, attached to the
# run, and an end-to-end passkey sign-in with Chromium's virtual authenticator.
# Not a required check: it produces evidence for review. Playwright comes from the
# `docs` dependency group (locked in uv.lock, docs/adr/0016): it is not a dependency
# of the application.
name: UI

on:
  pull_request:
    paths:
      - "src/**"
      - "design/**"
      - "tests/e2e/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Throwaway instance, reachable from the runner only.
  SECRET_KEY: ci-only-key-for-the-ui-job-not-a-secret-0123456789abcdef
  ALLOWED_HOSTS: localhost,127.0.0.1
  SECURE_SSL_REDIRECT: "false"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  SECURE_HSTS_SECONDS: "0"

jobs:
  browser:
    name: Screenshots and passkey sign-in
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies with the docs group (uv sync --locked)
        run: uv sync --locked --group docs
      - name: Install the browser (playwright install)
        run: uv run playwright install --with-deps --only-shell --no-progress chromium
      - name: Start the instance for the screenshots (production settings)
        env:
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/shots-data
          STATIC_ROOT: ${{ runner.temp }}/shots-static
          HOUSECAIRN_SIGNUP_OPEN: "true"
          OIDC_SERVER_URL: https://id.example.com
          OIDC_CLIENT_ID: housecairn
          OIDC_PROVIDER_NAME: Company SSO
          # The password reset page exists only with a mail server; nothing is sent.
          EMAIL_HOST: smtp.example.com
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py collectstatic --noinput
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          # The demonstration account owns homes and administers the instance, so that
          # the screens of both are captured. Its address is verified: open sign-up
          # makes verification mandatory, and no mail is sent from this instance.
          from allauth.account.models import EmailAddress
          user = User.objects.create_superuser(email='demo@example.com', password='correct-horse-battery-staple')
          EmailAddress.objects.create(user=user, email=user.email, primary=True, verified=True)
          home = services.create_home(user, name='Main house')
          services.create_home(user, name='Holiday flat')
          # A second member and a pending invitation for the household screens.
          from housecairn.homes.models import Membership, Role
          other = User.objects.create_user(email='sam@example.com', password=None)
          Membership.objects.create(home=home, user=other, role=Role.MEMBER)
          _invitation, raw = services.invite(
              user, home, email='guest@example.com', role=Role.READ_ONLY,
              delivery=services.Delivery(),
          )
          open('$RUNNER_TEMP/invitation-token', 'w').write(raw)
          from housecairn.instance import services as instance_services
          sent = []
          instance_services.invite(
              user, email='newcomer@example.com', send=lambda _invitation, secret: sent.append(secret)
          )
          open('$RUNNER_TEMP/instance-invitation-token', 'w').write(sent[0])
          "
          nohup uv run gunicorn housecairn.wsgi --bind 127.0.0.1:8000 > "$RUNNER_TEMP/shots-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: Take the screenshots
        run: |
          uv run python tests/e2e/browser_checks.py capture \
            --base http://localhost:8000 --out "$RUNNER_TEMP/screenshots" \
            --invitation-file "$RUNNER_TEMP/invitation-token" \
            --instance-invitation-file "$RUNNER_TEMP/instance-invitation-token"
      - name: Start a stub identity provider (serves only its discovery document)
        run: |
          mkdir -p "$RUNNER_TEMP/idp/.well-known"
          cat > "$RUNNER_TEMP/idp/.well-known/openid-configuration" <<'JSON'
          {
            "issuer": "http://127.0.0.1:8002",
            "authorization_endpoint": "http://127.0.0.1:8002/authorize",
            "token_endpoint": "http://127.0.0.1:8002/token",
            "userinfo_endpoint": "http://127.0.0.1:8002/userinfo"
          }
          JSON
          nohup python3 -m http.server 8002 --bind 127.0.0.1 --directory "$RUNNER_TEMP/idp" > "$RUNNER_TEMP/idp-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/.well-known/openid-configuration && break; sleep 1; done
      - name: Start the instance for the passkey sign-in (development settings)
        env:
          OIDC_SERVER_URL: http://127.0.0.1:8002
          OIDC_CLIENT_ID: housecairn
          OIDC_PROVIDER_NAME: Company SSO
          # WebAuthn needs a secure origin: http://localhost is one for the browser, and the
          # server accepts it when DEBUG is on (MFA_WEBAUTHN_ALLOW_INSECURE_ORIGIN).
          DEBUG: "true"
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/passkey-data
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          user = User.objects.create_user(email='demo@example.com', password='correct-horse-battery-staple')
          services.create_home(user, name='Main house')
          "
          nohup uv run python manage.py runserver 127.0.0.1:8001 --noreload > "$RUNNER_TEMP/passkey-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz && break; sleep 1; done
      - name: Sign in with a passkey (virtual authenticator)
        run: |
          uv run python tests/e2e/browser_checks.py passkey --base http://localhost:8001
      - name: One click from the sign-in page to the identity provider
        run: |
          uv run python tests/e2e/browser_checks.py sso \
            --base http://localhost:8001 --provider http://127.0.0.1:8002
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
