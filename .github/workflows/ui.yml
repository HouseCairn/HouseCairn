# Interface checks in a real browser (docs/adr/0017, docs/adr/0018): screenshots of
# the main screens on a phone and a desktop, in English and French, attached to the
# run, and an end-to-end passkey sign-in with Chromium's virtual authenticator.
# Not a required check: it produces evidence for review. Playwright comes from the
# `docs` dependency group (locked in uv.lock, docs/adr/0016): it is not a dependency
# of the application.
name: UI

on:
  pull_request:
    paths:
      - "src/**"
      - "design/**"
      - "tests/e2e/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Throwaway instance, reachable from the runner only.
  SECRET_KEY: ci-only-key-for-the-ui-job-not-a-secret-0123456789abcdef
  ALLOWED_HOSTS: localhost,127.0.0.1
  SECURE_SSL_REDIRECT: "false"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  SECURE_HSTS_SECONDS: "0"

jobs:
  browser:
    name: Screenshots and passkey sign-in
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies with the docs group (uv sync --locked)
        run: uv sync --locked --group docs
      - name: Install the browser (playwright install)
        run: uv run playwright install --with-deps --only-shell --no-progress chromium
      - name: Start the instance for the screenshots (production settings)
        env:
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/shots-data
          STATIC_ROOT: ${{ runner.temp }}/shots-static
          HOUSECAIRN_SIGNUP_OPEN: "true"
          OIDC_SERVER_URL: https://id.example.com
          OIDC_CLIENT_ID: housecairn
          OIDC_PROVIDER_NAME: Company SSO
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py collectstatic --noinput
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          user = User.objects.create_user(email='demo@example.com', password='correct-horse-battery-staple')
          services.create_home(user, name='Main house')
          services.create_home(user, name='Holiday flat')
          "
          nohup uv run gunicorn housecairn.wsgi --bind 127.0.0.1:8000 > "$RUNNER_TEMP/shots-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: Take the screenshots
        run: |
          uv run python tests/e2e/browser_checks.py capture \
            --base http://localhost:8000 --out "$RUNNER_TEMP/screenshots"
      - name: Start the instance for the passkey sign-in (development settings)
        env:
          # WebAuthn needs a secure origin: http://localhost is one for the browser, and the
          # server accepts it when DEBUG is on (MFA_WEBAUTHN_ALLOW_INSECURE_ORIGIN).
          DEBUG: "true"
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/passkey-data
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          user = User.objects.create_user(email='demo@example.com', password='correct-horse-battery-staple')
          services.create_home(user, name='Main house')
          "
          nohup uv run python manage.py runserver 127.0.0.1:8001 --noreload > "$RUNNER_TEMP/passkey-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz && break; sleep 1; done
      - name: Sign in with a passkey (virtual authenticator)
        run: |
          uv run python tests/e2e/browser_checks.py passkey --base http://localhost:8001
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
