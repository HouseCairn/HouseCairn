# Developer Certificate of Origin: every commit of a pull request carries a
# Signed-off-by line from its author (docs/adr/0014, CONTRIBUTING.md).
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out with the history of the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Bot commits are exempt only in a pull request opened by that bot.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_signoff.py "$BASE_SHA" "$HEAD_SHA"
