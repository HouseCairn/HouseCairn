# Documentation site (docs/adr/0016): build and check it on every pull request
# and merge queue entry (docs/adr/0040), publish it to GitHub Pages
# (https://docs.housecairn.app) on `main`.
# Job names are status checks: rename them only together with the ruleset.
name: Documentation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # Weekly check of the external links, on the default branch only.
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  docs:
    name: Documentation
    # Everything deterministic. The scheduled run only checks external links.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies with the docs group (uv sync --locked)
        run: uv sync --locked --group docs

      - name: Compile the translations
        uses: ./.github/actions/compile-messages

      - name: Install the browser (playwright install)
        # Official command of the Playwright version in uv.lock; the browser
        # opens the built site for the design checks below (docs/adr/0016).
        run: uv run playwright install --with-deps --only-shell --no-progress chromium

      - name: Strict build, English and French
        run: uv run python scripts/build_docs.py

      - name: No external resource, internal links, API coverage
        run: uv run python scripts/check_docs_site.py docs/_build/site

      - name: Contrast, keyboard focus, reduced motion
        run: uv run python scripts/check_docs_design.py docs/_build/site

      - name: Tests of the site, of its help links and of its scripts
        env:
          HOUSECAIRN_DOCS_SITE: docs/_build/site
        run: uv run pytest tests/test_help_links.py tests/test_docs_extension.py tests/test_docs_scripts.py

      - name: Package the site for GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/site

  external-links:
    name: Documentation (external links)
    # Not a required check, on purpose: it depends on eight sites we do not
    # control, so a passing outage there must not block every pull request. It
    # still fails visibly (red check on the pull request, red weekly run).
    # Everything deterministic is in the `Documentation` job above. Not on the
    # merge queue either: an outage elsewhere must not hold up the queue.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies with the docs group (uv sync --locked)
        run: uv sync --locked --group docs

      - name: External links (sphinx linkcheck)
        run: uv run python scripts/build_docs.py --linkcheck

  publish:
    name: Publish documentation
    # Only the commits of `main`, after the site above was built and checked.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
