# Compiles the translation catalogs (docs/adr/0013). The compiled `django.mo` is
# not committed: every job that runs the application or its tests calls this
# step after `uv sync`. It needs GNU gettext (`msgfmt`), which is also what the
# container image build and `check_translations --sources` use.
name: Compile the translations
description: Install GNU gettext and run compilemessages for the application catalogs.

runs:
  using: composite
  steps:
    - name: Install GNU gettext
      shell: bash
      run: |
        # Nothing to do when msgfmt is already there. Otherwise the package
        # lists of the runner image are tried first: refreshing them costs
        # several seconds per job, and gettext comes from the release pocket of
        # Ubuntu, which does not change. Only when that install fails are the
        # lists refreshed. Each failed download is retried three times; the
        # last failure still fails the step. No scan for services to restart:
        # the runner is thrown away after the job.
        if ! command -v msgfmt >/dev/null; then
          apt=(sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1
            apt-get -o Acquire::Retries=3)
          install=(install -y -q --no-install-recommends gettext)
          if ! "${apt[@]}" "${install[@]}"; then
            "${apt[@]}" update -q
            "${apt[@]}" "${install[@]}"
          fi
        fi
        msgfmt --version | sed -n 1p
    - name: Compile the translations (compilemessages)
      shell: bash
      env:
        DEBUG: "true"
      # The documentation catalogs are built by Sphinx, and .venv holds the
      # dependencies' own catalogs: neither is compiled here.
      run: uv run --no-sync python manage.py compilemessages --ignore=.venv --ignore=docs
