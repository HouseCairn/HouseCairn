# Compiles the translation catalogs (docs/adr/0013). The compiled `django.mo` is
# not committed: every job that runs the application or its tests calls this
# step after `uv sync`. It needs GNU gettext (`msgfmt`), which is also what the
# container image build and `check_translations --sources` use.
name: Compile the translations
description: Install GNU gettext and run compilemessages for the application catalogs.

runs:
  using: composite
  steps:
    - name: Install GNU gettext
      shell: bash
      run: |
        # Each failed download is retried three times; the last failure
        # still fails the step.
        sudo apt-get -o Acquire::Retries=3 update -q
        sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends gettext
    - name: Compile the translations (compilemessages)
      shell: bash
      env:
        DEBUG: "true"
      # The documentation catalogs are built by Sphinx, and .venv holds the
      # dependencies' own catalogs: neither is compiled here.
      run: uv run --no-sync python manage.py compilemessages --ignore=.venv --ignore=docs
