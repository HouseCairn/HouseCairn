# Dependency updates (docs/adr/0014). Weekly, minor and patch updates grouped
# per ecosystem, and a 7-day cooldown: a new release is only proposed once it
# has been public for a week, so a compromised release has time to be noticed
# and withdrawn. Security updates are not delayed by the cooldown.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  # Base images of the Dockerfile (docs/adr/0015): tag and digest together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  # Images of the example compose.yaml (the PostgreSQL service). The PostgreSQL
  # image of ci.yml and of .github/scripts/image-smoke.sh is the same one and
  # is updated by hand in the same pull request.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Housecairn's own image: the example follows its releases by hand.
      - dependency-name: ghcr.io/housecairn/housecairn
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
