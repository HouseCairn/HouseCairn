# Dependency updates (docs/adr/0014). Weekly, minor and patch updates grouped
# per ecosystem, and a 7-day cooldown: a new release is only proposed once it
# has been public for a week, so a compromised release has time to be noticed
# and withdrawn. Security updates are not delayed by the cooldown.
version: 2

updates:
  # Django stays on the 5.2 LTS line until the next LTS is adopted in a dedicated
  # migration lot: no major version updates for these packages. Minor, patch and
  # security updates continue. Remove this block at that migration.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-stubs-ext"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  # For the container image of lot J1-D; does nothing until a Dockerfile exists.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
