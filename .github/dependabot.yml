# Dependency updates (docs/adr/0014). Weekly (daily for the base image of the
# Dockerfile, docs/adr/0015), minor and patch updates grouped
# per ecosystem, and a 7-day cooldown: a new release is only proposed once it
# has been public for a week, so a compromised release has time to be noticed
# and withdrawn. Security updates are not delayed by the cooldown.
version: 2

updates:
  # Django stays on the 5.2 LTS line until the next LTS is adopted in a dedicated
  # migration lot: no major version updates for these packages. Minor, patch and
  # security updates continue. Remove this block at that migration.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-stubs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-stubs-ext"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  # Base images of the Dockerfile (docs/adr/0015): tag and digest together.
  # The Python base image stays on the 3.13 line: Dependabot reports the jump to
  # 3.14 or later as a minor update, and such a jump is a migration lot (Django
  # 5.2 support, requires-python, uv lock, CI), not an automatic update. Patch
  # releases of 3.13.x still come through. Remove this ignore at that migration.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # The Python base image has no cooldown: its rebuilds carry Debian security
    # fixes, which a 7-day wait would only delay. Its digest is pinned next to
    # its tag, so Dependabot proposes each rebuild. The other images of the
    # Dockerfile (uv) keep the cooldown.
    cooldown:
      default-days: 7
      exclude:
        - python
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  # Images of the example compose.yaml (the PostgreSQL service). The PostgreSQL
  # image of ci.yml and of .github/scripts/image-smoke.sh is the same one and
  # is updated by hand in the same pull request. deploy/coolify/docker-compose.yaml
  # (Coolify) runs the same images (tests/test_coolify_compose.py).
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy/coolify"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # HouseCairn's own image: the example follows its releases by hand.
      - dependency-name: ghcr.io/housecairn/housecairn
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
